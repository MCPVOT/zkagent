[package]
name = "zkagent-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "MCP server shell for zkagent: expose zero-knowledge agent attestation to any agent harness"
license = "MIT"
repository = "https://github.com/MCPVOT/zkagent"
readme = "../../README.md"
keywords = ["zero-knowledge", "attestation", "mcp", "agent", "harness"]
categories = ["cryptography", "api-bindings"]

[[bin]]
name = "zkagent-mcp"
path = "src/main.rs"

[dependencies]
zkagent-core = { path = "../zkagent-core", version = "0.1.0" }
zkagent-proofs = { path = "../zkagent-proofs", version = "0.1.0" }
zkagent-service = { path = "../zkagent-service", version = "0.1.0" }
zkagent-verifier = { path = "../zkagent-verifier", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
