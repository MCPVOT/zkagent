[package]
name = "zkagent-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP server shell for zkagent: expose zero-knowledge agent attestation to any agent harness"
license.workspace = true
repository = "https://github.com/MCPVOT/zkagent"
readme = "../../README.md"
keywords = ["zero-knowledge", "attestation", "mcp", "agent", "harness"]
categories = ["cryptography", "api-bindings"]

[[bin]]
name = "zkagent-mcp"
path = "src/main.rs"

[dependencies]
zkagent-service = { path = "../zkagent-service", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
