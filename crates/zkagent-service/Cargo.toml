[package]
name = "zkagent-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Embeddable operations layer for zkagent: setup, authorise, prove, verify"
license = "MIT"
repository = "https://github.com/MCPVOT/zkagent"
readme = "../../README.md"
keywords = ["zero-knowledge", "attestation", "groth16", "agent", "embedding"]
categories = ["cryptography", "authentication"]

[dependencies]
zkagent-core = { path = "../zkagent-core", version = "0.1.0" }
zkagent-wire = { path = "../zkagent-wire", version = "0.1.0" }
zkagent-proofs = { path = "../zkagent-proofs", version = "0.1.0" }
zkagent-verifier = { path = "../zkagent-verifier", version = "0.1.0" }
zkagent-ipfs = { path = "../zkagent-ipfs", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"

[features]
default = []
# Forwards to `zkagent-ipfs/gateway`: enables `GatewaySource`, so a verifier with
# no IPFS node can fetch a bundle by CID over HTTPS. Off by default, because a
# host that already holds its blocks should not carry an HTTP client and a TLS
# stack. `cargo test --all-features` compiles and tests it.
gateway = ["zkagent-ipfs/gateway"]

[dev-dependencies]
tempfile = "3"
