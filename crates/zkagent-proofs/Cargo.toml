[package]
name = "zkagent-proofs"
description = "Groth16 circuit and prover for zero-knowledge agent execution attestation"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/MCPVOT/zkagent"

[dependencies]
zkagent-core = { path = "../zkagent-core" }
zkagent-wire = { path = "../zkagent-wire" }
ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve", "std"] }
ark-ec = { version = "0.5.0", default-features = false, features = ["std"] }
ark-ff = { version = "0.5.0", default-features = false, features = ["std"] }
ark-groth16 = { version = "0.5.0", default-features = false, features = ["std", "r1cs", "parallel"] }
ark-relations = { version = "0.5.1", default-features = false, features = ["std"] }
ark-r1cs-std = { version = "0.5.0", default-features = false, features = ["std"] }
ark-serialize = { version = "0.5.0", default-features = false, features = ["derive", "std"] }
ark-snark = { version = "0.5.1", default-features = false }
ark-std = { version = "0.5.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
ark-std = { version = "0.5.0", default-features = false, features = ["std"] }
