[package]
name = "zkagent-verifier"
description = "Verifier and CLI for zero-knowledge agent execution attestation"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/MCPVOT/zkagent"

[lib]
name = "zkagent_verifier"
path = "src/lib.rs"

[[bin]]
name = "zkagent"
path = "src/main.rs"

[dependencies]
zkagent-core = { path = "../zkagent-core" }
zkagent-proofs = { path = "../zkagent-proofs" }
ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve", "std"] }
ark-ec = { version = "0.5.0", default-features = false, features = ["std"] }
ark-groth16 = { version = "0.5.0", default-features = false, features = ["std"] }
ark-serialize = { version = "0.5.0", default-features = false, features = ["derive", "std"] }
ark-snark = { version = "0.5.1", default-features = false }
ark-std = { version = "0.5.0", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
ark-std = { version = "0.5.0", default-features = false, features = ["std"] }
