[package]
name = "zkagent-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Command line shell for zkagent: setup, authorise, prove, verify"
license = "MIT"
repository = "https://github.com/MCPVOT/zkagent"
readme = "../../README.md"
keywords = ["zero-knowledge", "attestation", "groth16", "cli"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "zkagent"
path = "src/main.rs"

[dependencies]
zkagent-core = { path = "../zkagent-core", version = "0.1.0" }
zkagent-proofs = { path = "../zkagent-proofs", version = "0.1.0" }
zkagent-service = { path = "../zkagent-service", version = "0.1.0" }
zkagent-verifier = { path = "../zkagent-verifier", version = "0.1.0" }
zkagent-ipfs = { path = "../zkagent-ipfs", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
hex = "0.4"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
