[package]
name = "zkagent-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command line shell for zkagent: setup, authorise, prove, verify"
license.workspace = true
repository = "https://github.com/MCPVOT/zkagent"
readme = "../../README.md"
keywords = ["zero-knowledge", "attestation", "groth16", "cli"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "zkagent"
path = "src/main.rs"

[dependencies]
zkagent-service = { path = "../zkagent-service", version = "0.4.0" }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
