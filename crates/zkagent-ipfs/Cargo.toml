[package]
name = "zkagent-ipfs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Content addressing for zkagent attestation artifacts (CIDv1 + block sources)"
license = "MIT"
repository = "https://github.com/MCPVOT/zkagent"
keywords = ["ipfs", "cid", "content-addressing", "zero-knowledge", "attestation"]
categories = ["cryptography", "filesystem"]

[dependencies]
cid = "0.11"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Only for GatewaySource. A verifier that has no IPFS node can still fetch by
# CID over HTTPS; the block is re-hashed, so the gateway is never trusted.
ureq = { version = "2", optional = true }

[features]
default = []
# `--features gateway` adds `GatewaySource`, and with it an HTTP client.
gateway = ["dep:ureq"]

[dev-dependencies]
tempfile = "3"
