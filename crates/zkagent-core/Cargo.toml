[package]
name = "zkagent-core"
description = "Protocol data types for zero-knowledge attestation of AI agent executions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/MCPVOT/zkagent"
homepage = "https://github.com/MCPVOT/zkagent"

[dependencies]
ark-ec = { version = "0.5.0", default-features = false, features = ["std"] }
ark-ff = { version = "0.5.0", default-features = false, features = ["std"] }
ark-serialize = { version = "0.5.0", default-features = false, features = ["derive", "std"] }
ark-std = { version = "0.5.0", default-features = false, features = ["std"] }
ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve", "std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ark-std = { version = "0.5.0", default-features = false, features = ["std"] }
