[package]
name = "zkagent-crossverify"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

# Standalone on purpose, like `examples/tauri-plugin`: this is a probe that reads
# zkagent's artifacts, not part of the library's API surface. It must never be a
# dependency of the workspace.
[workspace]

[dependencies]
zkagent-proofs = { path = "../../crates/zkagent-proofs" }
ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve", "std"] }
ark-ff = { version = "0.5.0", default-features = false, features = ["std"] }
ark-groth16 = { version = "0.5.0", default-features = false, features = ["std"] }
ark-serialize = { version = "0.5.0", default-features = false, features = ["derive", "std"] }
hex = "0.4"
serde_json = "1"
