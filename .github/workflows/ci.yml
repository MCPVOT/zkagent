name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  # Prove-on-CI is CPU-bound; keep the NTT work from thrashing a 2-core runner.
  RAYON_NUM_THREADS: 2

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: format check
        run: cargo fmt --all -- --check

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

      - name: release build
        run: cargo build --release

      # The half a unit test cannot cover: the real binary, real artifacts, and
      # the exit-code contract (0 accept, 1 reject, 2 usage/IO).
      #
      # Security note: no `${{ github.event.* }}` value is interpolated into this
      # script, so there is no command-injection vector; every value is a literal
      # or produced by the build.
      - name: end-to-end CLI
        shell: bash
        run: |
          set -uo pipefail
          # GitHub sets GITHUB_WORKSPACE; fall back to pwd for a local run. Do NOT
          # rely on `pwd` alone: the step later `cd`s into a temp dir, and a
          # relative binary path then resolves against the wrong directory.
          ROOT="${GITHUB_WORKSPACE:-$(pwd)}"
          BIN="$ROOT/target/release/zkagent"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          [ -x "$BIN" ] || { echo "FAIL: no release binary at $BIN"; exit 1; }

          WORK="$(mktemp -d)"
          cd "$WORK"

          "$BIN" setup --seed 7 --out keys/ || exit 1
          "$BIN" policy --max-amount 1000 --max-per-action 300 --expires-at 2000 \
            --chain-id 1 --targets 3,7,9 --seed 99 --out policy.json || exit 1
          printf '%s\n' '{"total_amount":400,"action_count":2,"completed_at":1500,"chain_id":1,"execution_id":1001}' > receipt.json
          printf '%s\n' '[{"target":3,"amount":250,"trace_digest":11},{"target":7,"amount":150,"trace_digest":22}]' > actions.json
          "$BIN" prove --keys keys/ --policy policy.json --receipt receipt.json \
            --actions actions.json --out proof.json || exit 1

          fail=0
          rc=0

          # NOTE: GitHub runs `shell: bash` as `bash -e ...`, so a command that
          # is SUPPOSED to exit non-zero aborts the whole step before any
          # `[ $? -eq N ]` check runs. `cmd || rc=$?` is the idiom that survives
          # errexit: the `||` handles the failure, so `-e` never fires.
          #
          # 1. honest receipt must ACCEPT (exit 0)
          rc=0
          "$BIN" verify --keys keys/ --policy policy.json --receipt receipt.json \
            --proof proof.json --now 1600 || rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL: honest receipt was not accepted (exit $rc)"; fail=1; }

          # 2. replay with a bumped execution id must REJECT (exit 1)
          sed 's/"execution_id":1001/"execution_id":1002/' receipt.json > receipt2.json
          rc=0
          "$BIN" verify --keys keys/ --policy policy.json --receipt receipt2.json \
            --proof proof.json --now 1600 || rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: replayed proof was not rejected (exit $rc)"; fail=1; }

          # 3. an over-cap action must be refused by the prover (exit 2)
          printf '%s\n' '[{"target":3,"amount":999,"trace_digest":1}]' > bad.json
          rc=0
          "$BIN" prove --keys keys/ --policy policy.json --receipt receipt.json \
            --actions bad.json --out bad_proof.json || rc=$?
          [ "$rc" -eq 2 ] || { echo "FAIL: over-cap action was not refused (exit $rc)"; fail=1; }

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "e2e exit-code contract OK"
