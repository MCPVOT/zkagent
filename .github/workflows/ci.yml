name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  # Prove-on-CI is CPU-bound; keep the NTT work from thrashing a 2-core runner.
  RAYON_NUM_THREADS: 2

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: format check
        run: cargo fmt --all -- --check

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

      # The leaderboard's attribution rules decide whether a contributor keeps
      # credit when a maintainer re-lands their work. Stdlib-only, so it runs
      # everywhere. `python` is not guaranteed on ubuntu runners, `python3` is
      # not guaranteed on windows ones, so probe for both.
      - name: test the leaderboard attribution rules
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python || command -v python3)"
          [ -n "$PY" ] || { echo "FAIL: no python on PATH"; exit 1; }
          "$PY" tools/leaderboard/test_generate.py

      - name: release build
        run: cargo build --release

      # The embeddable example is a standalone crate (excluded from the
      # workspace). It must still compile and test on its own.
      - name: "tauri example (no tauri feature: headless-safe)"
        run: cargo test --manifest-path examples/tauri-plugin/Cargo.toml

      # 5b. THE HARNESS PATH: the same flow driven over MCP JSON-RPC, with no
      #     CLI involved. This is what an agent harness (Hermes, Claude Code,
      #     OpenCode) actually does, so it gets its own end-to-end check.
      - name: end-to-end MCP harness
        shell: bash
        run: |
          set -uo pipefail
          ROOT="${GITHUB_WORKSPACE:-$(pwd)}"
          MCP="$ROOT/target/release/zkagent-mcp"
          [ -x "$MCP" ] || { echo "FAIL: no MCP server at $MCP"; exit 1; }

          WORK="$(mktemp -d)"
          cd "$WORK"
          printf '%s\n' '{"total_amount":400,"action_count":2,"completed_at":1500,"chain_id":1,"execution_id":1001}' > receipt.json
          printf '%s\n' '[{"target":3,"amount":250,"trace_digest":11},{"target":7,"amount":150,"trace_digest":22}]' > actions.json

          cat <<'JSON' | "$MCP" > mcp.out
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          {"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"zkagent_setup","arguments":{"keys_dir":"keys"}}}
          {"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"zkagent_authorize","arguments":{"policy_path":"policy.json","authority_key_path":"authority.hex","max_amount":1000,"max_per_action":300,"expires_at":2000,"chain_id":1,"targets":[3,7,9]}}}
          {"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"zkagent_prove","arguments":{"keys_dir":"keys","policy_path":"policy.json","receipt_path":"receipt.json","actions_path":"actions.json","proof_path":"proof.json"}}}
          {"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"zkagent_verify","arguments":{"keys_dir":"keys","policy_path":"policy.json","receipt_path":"receipt.json","proof_path":"proof.json","seen_path":"seen.json","now":1600}}}
          {"jsonrpc":"2.0","id":7,"method":"tools/call","params":{"name":"zkagent_verify","arguments":{"keys_dir":"keys","policy_path":"policy.json","receipt_path":"receipt.json","proof_path":"proof.json","seen_path":"seen.json","now":1600}}}
          JSON

          fail=0
          # One response per request, and nothing else on stdout.
          lines=$(wc -l < mcp.out)
          [ "$lines" -eq 7 ] || { echo "FAIL: expected 7 MCP responses, got $lines"; fail=1; }

          grep -q '"protocolVersion"' mcp.out || { echo "FAIL: initialize did not answer"; fail=1; }
          grep -q 'zkagent_verify' mcp.out || { echo "FAIL: tools/list missing zkagent_verify"; fail=1; }
          # The first verify must accept.
          sed -n '6p' mcp.out | grep -q '"accepted":true' || { echo "FAIL: MCP verify did not accept"; fail=1; }
          # The second verify of the same proof must be refused as a replay.
          sed -n '7p' mcp.out | grep -q 'already accepted' || { echo "FAIL: MCP replay was not refused"; fail=1; }

          if [ "$fail" -ne 0 ]; then echo "--- mcp.out ---"; cat mcp.out; exit 1; fi
          echo "MCP harness path OK"

      # The content-addressed path: publish four blocks under their CIDs, verify
      # from the manifest alone, then prove that a tampered block is refused.
      - name: end-to-end content-addressed bundle
        shell: bash
        run: |
          set -uo pipefail
          ROOT="${GITHUB_WORKSPACE:-$(pwd)}"
          BIN="$ROOT/target/release/zkagent"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          [ -x "$BIN" ] || { echo "FAIL: no release binary at $BIN"; exit 1; }

          WORK="$(mktemp -d)"
          cd "$WORK"

          "$BIN" setup --seed 7 --out keys/ || exit 1
          "$BIN" policy --max-amount 1000 --max-per-action 300 --expires-at 2000 \
            --chain-id 1 --targets 3,7,9 --authority-key authority.hex --out policy.json || exit 1
          printf '%s\n' '{"total_amount":400,"action_count":2,"completed_at":1500,"chain_id":1,"execution_id":9001}' > receipt.json
          printf '%s\n' '[{"target":3,"amount":250,"trace_digest":11},{"target":7,"amount":150,"trace_digest":22}]' > actions.json
          "$BIN" prove --keys keys/ --policy policy.json --receipt receipt.json \
            --actions actions.json --out proof.json || exit 1

          fail=0
          rc=0

          # 1. publish: four blocks, each named by a CIDv1 raw sha2-256 string.
          "$BIN" publish --keys keys/ --policy policy.json --receipt receipt.json \
            --proof proof.json --actions actions.json --out attestation.json --blocks blocks/ || rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL: publish exited $rc"; fail=1; }
          blocks=$(ls blocks/*.block 2>/dev/null | wc -l)
          [ "$blocks" -eq 4 ] || { echo "FAIL: expected 4 blocks, got $blocks"; fail=1; }
          names=$(ls blocks/ | grep -c '^bafkrei' || true)
          [ "$names" -eq 4 ] || { echo "FAIL: block names are not CIDv1 raw base32 ($names/4)"; fail=1; }
          # The measured circuit identity must be recorded, not copied.
          grep -q '"public_inputs": 15' attestation.json || { echo "FAIL: manifest lacks the measured arity"; fail=1; }

          # 2. verify from the manifest alone: must accept.
          "$BIN" verify-bundle --manifest attestation.json --blocks blocks/ --now 1600 || rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL: bundle verify did not accept (exit $rc)"; fail=1; }

          # 3. flip one bit in one block: must be refused as a fetch/integrity error.
          victim=$(ls blocks/*.block | head -1)
          printf '\xff' | dd of="$victim" bs=1 seek=8 count=1 conv=notrunc 2>/dev/null
          "$BIN" verify-bundle --manifest attestation.json --blocks blocks/ --now 1600 || rc=$?
          [ "$rc" -eq 2 ] || { echo "FAIL: a tampered block must exit 2, got $rc"; fail=1; }

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "content-addressed bundle path OK"

      - name: end-to-end CLI
        shell: bash
        run: |
          set -uo pipefail
          # GitHub sets GITHUB_WORKSPACE; fall back to pwd for a local run. Do NOT
          # rely on `pwd` alone: the step later `cd`s into a temp dir, and a
          # relative binary path then resolves against the wrong directory.
          ROOT="${GITHUB_WORKSPACE:-$(pwd)}"
          BIN="$ROOT/target/release/zkagent"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          [ -x "$BIN" ] || { echo "FAIL: no release binary at $BIN"; exit 1; }

          WORK="$(mktemp -d)"
          cd "$WORK"

          "$BIN" setup --seed 7 --out keys/ || exit 1
          "$BIN" policy --max-amount 1000 --max-per-action 300 --expires-at 2000 \
            --chain-id 1 --targets 3,7,9 --authority-key auth.hex --out policy.json || exit 1
          printf '%s\n' '{"total_amount":400,"action_count":2,"completed_at":1500,"chain_id":1,"execution_id":1001}' > receipt.json
          printf '%s\n' '[{"target":3,"amount":250,"trace_digest":11},{"target":7,"amount":150,"trace_digest":22}]' > actions.json
          "$BIN" prove --keys keys/ --policy policy.json --receipt receipt.json \
            --actions actions.json --out proof.json || exit 1

          fail=0
          rc=0

          # NOTE: GitHub runs `shell: bash` as `bash -e ...`, so a command that
          # is SUPPOSED to exit non-zero aborts the whole step before any
          # `[ $? -eq N ]` check runs. `cmd || rc=$?` is the idiom that survives
          # errexit: the `||` handles the failure, so `-e` never fires.
          #
          # 1. honest receipt must ACCEPT (exit 0)
          rc=0
          "$BIN" verify --keys keys/ --policy policy.json --receipt receipt.json \
            --proof proof.json --now 1600 || rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL: honest receipt was not accepted (exit $rc)"; fail=1; }

          # 2. replay with a bumped execution id must REJECT (exit 1)
          sed 's/"execution_id":1001/"execution_id":1002/' receipt.json > receipt2.json
          rc=0
          "$BIN" verify --keys keys/ --policy policy.json --receipt receipt2.json \
            --proof proof.json --now 1600 || rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: replayed proof was not rejected (exit $rc)"; fail=1; }

          # 3. an over-cap action must be refused by the prover (exit 2)
          printf '%s\n' '[{"target":3,"amount":999,"trace_digest":1}]' > bad.json
          rc=0
          "$BIN" prove --keys keys/ --policy policy.json --receipt receipt.json \
            --actions bad.json --out bad_proof.json || rc=$?
          [ "$rc" -eq 2 ] || { echo "FAIL: over-cap action was not refused (exit $rc)"; fail=1; }

          # 4. replay protection with a persistent seen-set: the first verify
          #    accepts and records, the second must be refused (exit 1).
          rc=0
          "$BIN" verify --keys keys/ --policy policy.json --receipt receipt.json \
            --proof proof.json --now 1600 --seen ids.json || rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL: first verify with --seen was not accepted (exit $rc)"; fail=1; }

          rc=0
          "$BIN" verify --keys keys/ --policy policy.json --receipt receipt.json \
            --proof proof.json --now 1600 --seen ids.json || rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: replayed proof was accepted despite a seen-set (exit $rc)"; fail=1; }

          # 5. a corrupt seen-set must fail CLOSED (exit 2), never verify against
          #    an empty set — otherwise truncating the file defeats replay defence.
          printf '%s' '{"execution_ids":[1,' > ids_bad.json
          rc=0
          "$BIN" verify --keys keys/ --policy policy.json --receipt receipt.json \
            --proof proof.json --now 1600 --seen ids_bad.json || rc=$?
          [ "$rc" -eq 2 ] || { echo "FAIL: corrupt seen-set did not fail closed (exit $rc)"; fail=1; }

          # 6. a TAMPERED policy must be refused by name (exit 1), not reported
          #    as a generic input mismatch — the forgery signal must survive.
          sed 's/"max_amount": 1000/"max_amount": 999999/' policy.json > policy_tampered.json
          rc=0
          "$BIN" verify --keys keys/ --policy policy_tampered.json --receipt receipt.json \
            --proof proof.json --now 1600 || rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: tampered policy was not refused (exit $rc)"; fail=1; }

          # 7. signing a policy with NO key must be refused (exit 2): the tool
          #    must never invent an authorisation root from a default seed.
          rc=0
          "$BIN" policy --max-amount 1000 --max-per-action 300 --expires-at 2000 \
            --chain-id 1 --targets 3,7,9 --out nokey.json || rc=$?
          [ "$rc" -eq 2 ] || { echo "FAIL: keyless policy signing was not refused (exit $rc)"; fail=1; }
          [ ! -f nokey.json ] || { echo "FAIL: a keyless policy file was written"; fail=1; }

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "e2e exit-code contract OK"
